name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  #  Garde-fou : le tag doit correspondre a _VERSION (app/gui.py), sinon la fenetre
  #  « A propos » afficherait une autre version que l'installateur et le .deb
  # ─────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que le tag correspond a _VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION="$(sed -n 's/^_VERSION = "\(.*\)"$/\1/p' app/gui.py)"
          if [ -z "$CODE_VERSION" ] || [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "Le tag '$GITHUB_REF_NAME' ne correspond pas a _VERSION='$CODE_VERSION' (app/gui.py)." >&2
            echo "Corrigez _VERSION puis recreez le tag." >&2
            exit 1
          fi
          echo "OK : tag $GITHUB_REF_NAME = _VERSION $CODE_VERSION"

  # ─────────────────────────────────────────────
  #  Windows — installateur .exe (Inno Setup)
  # ─────────────────────────────────────────────
  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire la version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Telecharger Python embeddable 3.11
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" `
            -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" `
            -DestinationPath "installer\windows\python-embed" -Force

      - name: Telecharger get-pip.py
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" `
            -OutFile "installer\windows\get-pip.py"

      - name: Telecharger ffmpeg Windows
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile "ffmpeg-win.zip"
          Expand-Archive -Path "ffmpeg-win.zip" -DestinationPath "ffmpeg-tmp" -Force
          New-Item -ItemType Directory -Force -Path "ffmpeg\windows" | Out-Null
          Get-ChildItem -Recurse -Filter "ffmpeg.exe" "ffmpeg-tmp" |
            Select-Object -First 1 |
            Copy-Item -Destination "ffmpeg\windows\ffmpeg.exe"

      - name: Creer le dossier dist
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "dist" | Out-Null

      - name: Compiler avec Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ steps.version.outputs.VERSION }}" "installer\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verifier l installateur Windows
        shell: pwsh
        run: |
          $exe = "dist\AutoTranscript-Setup-Windows.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installateur manquant : $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { Write-Error "Installateur trop petit ($size octets)"; exit 1 }
          Write-Host "OK : $exe ($([math]::Round($size/1MB, 1)) Mo)"

      - name: Upload artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/AutoTranscript-Setup-Windows.exe

  # ─────────────────────────────────────────────
  #  Linux — paquet .deb
  # ─────────────────────────────────────────────
  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire la version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Construire le paquet .deb
        run: |
          chmod +x installer/linux/build-deb.sh
          VERSION=${{ steps.version.outputs.VERSION }} ./installer/linux/build-deb.sh

      - name: Verifier l installation du paquet
        run: |
          sudo apt-get install -y ffmpeg python3-tk python3-venv --quiet
          sudo dpkg --unpack ./dist/*.deb
          pip install "$(grep -i '^customtkinter' requirements.txt)" --quiet
          python3 /opt/autotranscript/app/main.py --check

      - name: Upload artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  # ─────────────────────────────────────────────
  #  Modèle pyannote — téléchargé depuis HuggingFace
  #  et packagé comme asset de release (zip + .sha256)
  #  Prérequis : secret HF_TOKEN dans le dépôt GitHub
  #  (Settings > Secrets and variables > Actions > onglet *Secrets*,
  #  pas *Variables*), appartenant à un compte ayant accepté les conditions de
  #  https://huggingface.co/pyannote/speaker-diarization-community-1
  # ─────────────────────────────────────────────
  package-pyannote:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer huggingface_hub
        run: pip install "$(grep -i '^huggingface_hub' requirements.txt)"

      - name: Telecharger et packager le modele pyannote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p dist
          python scripts/download_pyannote.py

      # Sans HF_TOKEN ni acces a HuggingFace : comme chez l'utilisateur
      - name: Verifier le chargement hors ligne du modele
        run: |
          pip install "$(grep -i '^pyannote.audio' requirements.txt)" --quiet
          python scripts/check_pyannote_zip.py

      - name: Upload artifact pyannote
        uses: actions/upload-artifact@v4
        with:
          name: pyannote-model
          path: |
            dist/pyannote-community-1.zip
            dist/pyannote-community-1.zip.sha256

  # ─────────────────────────────────────────────
  #  Créer la GitHub Release avec les trois fichiers
  # ─────────────────────────────────────────────
  create-release:
    needs: [build-windows, build-linux, package-pyannote]
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Creer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
